version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
            # Amplify sets NEXT_PUBLIC_* env vars in the build container, but
            # Next.js only inlines them into the client bundle when they exist
            # in a .env.production file at build time. Echo every NEXT_PUBLIC_
            # var into .env.production so Next.js sees them.
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
          - .next/cache/**/*
