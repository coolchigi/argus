name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No AWS credentials here. Nothing in this workflow reaches AWS.
# Node 22 matches the Lambda runtime (NODEJS_22_X in infra/lib). The repo has
# no .nvmrc or engines field to read it from.
env:
  NODE_VERSION: "22"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Needs the eslint.config.mjs fix from fix/eslint-config. Before that
      # lands, eslint crashes on startup.
      - run: npx eslint

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Services with a test script. Add a service here when it gets one.
        service: [policy-events, profiles]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      # The root package holds esbuild for NodejsFunction bundling during synth.
      - run: npm ci
      - run: npm ci
        working-directory: infra
      - run: npx tsc --noEmit
        working-directory: infra
      # The app has no context lookups, so synth runs without an AWS account.
      # The emails are placeholders for the two env vars the API stack reads.
      - run: npx cdk synth --quiet --no-notices
        working-directory: infra
        env:
          ARGUS_SES_FROM: ci@example.com
          ARGUS_DEMO_RCIC_EMAIL: ci@example.com
